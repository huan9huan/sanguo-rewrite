title: 关羽进店与同饮

location:
  id: zhuo_tavern
  label: 涿县酒肆
  type: tavern

beat:
  type: arrival_to_recognition
  action: 关羽推车进店，刘备邀他同坐，三人发现都要投军讨贼。
  change: 第三条主线进入画面，并与刘备、张飞接成同一条路。
  reader_takeaway: 关羽不只是登场，他被刘备看见，也被这张酒桌接住。

focus:
  primary: guan_yu
  reactors:
    - liu_bei
    - zhang_fei

characters:
  guan_yu:
    label: 关羽
    role: incoming_force
    state_from: offstage
    state_to: onstage
    caption: 推车进店，直奔投军。
    asset_cell: 7
    silhouette_cell: 8
  liu_bei:
    label: 刘备
    role: moral_anchor
    state_from: drinking_with_zhang_fei
    state_to: noticing_guan_yu
    caption: 举杯停住，一眼看出此人不凡。
    asset_cell: 9
    reaction_cell: 10
  zhang_fei:
    label: 张飞
    role: bond_maker
    state_from: talking_with_liu_bei
    state_to: sizing_up_guan_yu
    caption: 转身看去，兴奋起来。
    asset_cell: 11
    reaction_cell: 12

