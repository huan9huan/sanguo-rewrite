timeline:
  - at: 0.0
    caption: 涿县酒肆里，刘备与张飞正在对饮。
    highlight:
      - bg_zhuo_tavern_interior_day
      - prop_wine_table
  - at: 2.0
    caption: 门口忽然一暗，一个高大的影子停住。
    highlight:
      - bg_zhuo_tavern_door_shadow
      - char_guan_yu_silhouette
  - at: 4.0
    caption: 关羽推车进店，开口便说要投军。
    highlight:
      - char_guan_yu_first_appearance
      - prop_wheelbarrow
  - at: 6.0
    caption: 刘备停杯，张飞转身，三条主线第一次相接。
    highlight:
      - char_liu_bei_reaction
      - char_zhang_fei_reaction
      - token_open_triangle
  - at: 8.0
    caption: 刘备放下杯子，起身相邀：这位壮士，不介意的话，一起喝一杯？
    highlight:
      - char_liu_bei_reaction
      - char_guan_yu_first_appearance
      - prop_wine_table
  - at: 10.0
    caption: 关羽看了两人一眼，没有客气，拉开凳子坐下。
    highlight:
      - char_guan_yu_first_appearance
      - prop_wine_table
      - token_open_triangle
  - at: 12.0
    caption: 他只说几句：姓关名羽，杀过欺人的豪强，逃亡五六年，如今来投军。
    highlight:
      - char_guan_yu_first_appearance
      - token_open_triangle
  - at: 14.0
    caption: 刘备说出讨贼安民的志向。关羽点头，只回两个字：正好。
    highlight:
      - char_liu_bei_reaction
      - char_guan_yu_first_appearance
      - char_zhang_fei_reaction
      - token_open_triangle

