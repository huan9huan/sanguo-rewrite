<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>刘备旁白实验</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181613;
        --stage: #252018;
        --panel: rgba(20, 18, 15, 0.9);
        --panel-strong: rgba(10, 9, 8, 0.94);
        --line: rgba(255, 241, 203, 0.2);
        --text: #fff3d5;
        --muted: #c9b78c;
        --accent: #d8aa57;
        --accent-strong: #f0cf83;
        --shadow: rgba(0, 0, 0, 0.45);
        --font-ui: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(216, 170, 87, 0.18), transparent 32rem),
          linear-gradient(180deg, #211d18 0%, var(--bg) 55%, #0e0d0c 100%);
        color: var(--text);
        font-family: var(--font-ui);
      }

      button {
        font: inherit;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: end;
        isolation: isolate;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 76%, transparent 100%);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        z-index: -1;
        height: 46vh;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.48));
      }

      .portrait-panel {
        position: absolute;
        inset: 12px 0 12px 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 223, 146, 0.08), rgba(255, 223, 146, 0));
      }

      .portrait {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 14px 18px var(--shadow));
        transition: opacity 120ms ease;
        user-select: none;
        -webkit-user-drag: none;
      }

      .dialogue-shell {
        width: min(980px, calc(100vw - 28px));
        margin: 0 auto clamp(18px, 4vh, 38px);
      }

      .nameplate {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        min-width: 120px;
        height: 42px;
        padding: 0 22px;
        margin-left: clamp(16px, 4vw, 42px);
        border: 1px solid rgba(240, 207, 131, 0.5);
        background: linear-gradient(180deg, #594229, #312419);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.34);
        color: var(--accent-strong);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .dialogue {
        position: relative;
        min-height: 168px;
        margin-top: -1px;
        padding: 18px 20px 18px 18px;
        border: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(240, 207, 131, 0.12), transparent 28%, transparent 72%, rgba(240, 207, 131, 0.08)),
          var(--panel);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.045),
          0 22px 54px rgba(0, 0, 0, 0.42);
        overflow: hidden;
      }

      .dialogue::before,
      .dialogue::after {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(240, 207, 131, 0.44), transparent);
      }

      .dialogue::before {
        top: 10px;
      }

      .dialogue::after {
        bottom: 10px;
      }

      .dialogue-layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        align-items: stretch;
        gap: 18px;
        min-height: 130px;
      }

      .portrait-slot {
        position: relative;
        height: 100%;
        min-height: 130px;
        align-self: stretch;
        display: flex;
        align-items: end;
        justify-content: center;
        padding: 8px 4px 0;
        border-right: 1px solid rgba(240, 207, 131, 0.16);
      }

      .dialogue-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .line {
        min-height: 72px;
        margin: 0;
        color: var(--text);
        font-size: clamp(22px, 3.2vw, 34px);
        font-weight: 650;
        line-height: 1.55;
        letter-spacing: 0;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.72);
      }

      .caret {
        display: inline-block;
        width: 0.6em;
        color: var(--accent-strong);
        animation: blink 780ms steps(2, jump-none) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 20px;
      }

      .status {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .next {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 108px;
        min-height: 42px;
        border: 1px solid rgba(240, 207, 131, 0.52);
        background: linear-gradient(180deg, #76562d, #3e2d1c);
        color: #fff0c0;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
      }

      .next:hover {
        border-color: rgba(255, 232, 169, 0.8);
        color: #fff8dc;
      }

      .next:active {
        transform: translateY(1px);
      }

      @media (max-width: 720px) {
        body {
          overflow-y: auto;
        }

        .stage {
          min-height: 100svh;
        }

        .dialogue-shell {
          width: min(100vw - 18px, 980px);
          margin-bottom: 12px;
        }

        .nameplate {
          height: 38px;
          min-width: 102px;
          margin-left: 12px;
          padding: 0 18px;
          font-size: 18px;
        }

        .dialogue {
          min-height: 168px;
          padding: 14px;
        }

        .dialogue-layout {
          grid-template-columns: 88px minmax(0, 1fr);
          gap: 12px;
          min-height: 126px;
        }

        .portrait-slot {
          min-height: 126px;
          padding-top: 10px;
        }

        .line {
          font-size: 22px;
          line-height: 1.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="刘备旁白实验">
      <section class="dialogue-shell">
        <div class="nameplate">刘备</div>
        <div class="dialogue">
          <div class="dialogue-layout">
            <div class="portrait-slot" aria-hidden="true">
              <div class="portrait-panel"></div>
              <img id="portrait" class="portrait" src="say-done-cut.png" alt="" />
            </div>
            <div class="dialogue-copy">
              <p id="line" class="line"></p>
              <div class="controls">
                <p id="status" class="status">1 / 4</p>
                <button id="next" class="next" type="button">下一句</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const lines = [
        "诸位，天下乱了。可百姓还要活下去。",
        "我没有城池，也没有兵马。只有这一点不肯低头的心。",
        "若有人愿与我同行，我们便从此刻开始。",
        "前路很远。可只要兄弟还在，我就不会退。"
      ];

      const portrait = document.querySelector("#portrait");
      const lineEl = document.querySelector("#line");
      const statusEl = document.querySelector("#status");
      const nextButton = document.querySelector("#next");

      let lineIndex = 0;
      let charIndex = 0;
      let timer = 0;
      let isTyping = false;

      function setSpeaking(value) {
        portrait.src = value ? "saying-cut.png" : "say-done-cut.png";
      }

      function renderStatus() {
        statusEl.textContent = `${lineIndex + 1} / ${lines.length}`;
      }

      function finishLine() {
        window.clearTimeout(timer);
        charIndex = lines[lineIndex].length;
        lineEl.innerHTML = `${lines[lineIndex]}<span class="caret">▸</span>`;
        isTyping = false;
        setSpeaking(false);
      }

      function typeLine() {
        const text = lines[lineIndex];
        isTyping = true;
        setSpeaking(true);
        renderStatus();

        if (charIndex <= text.length) {
          lineEl.innerHTML = `${text.slice(0, charIndex)}<span class="caret">▸</span>`;
          charIndex += 1;
          timer = window.setTimeout(typeLine, 58);
          return;
        }

        isTyping = false;
        setSpeaking(false);
      }

      function advance() {
        if (isTyping) {
          finishLine();
          return;
        }

        lineIndex = (lineIndex + 1) % lines.length;
        charIndex = 0;
        lineEl.textContent = "";
        typeLine();
      }

      nextButton.addEventListener("click", advance);
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "Enter") {
          event.preventDefault();
          advance();
        }
      });

      new Image().src = "saying-cut.png";
      new Image().src = "say-done-cut.png";
      typeLine();
    </script>
  </body>
</html>
